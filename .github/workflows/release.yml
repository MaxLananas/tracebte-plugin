name: TraceBTE Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Get latest version
        id: version
        run: |
          CURRENT=$(grep 'version = "' build.gradle.kts | sed 's/.*version = "\(.*\)"/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update build.gradle.kts version
        run: |
          sed -i 's/version = "${{ steps.version.outputs.current }}"/version = "${{ steps.version.outputs.new }}"/' build.gradle.kts

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.gradle.kts
          git commit -m "Release v${{ steps.version.outputs.new }}"
          git push

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Detect JAR
        id: jar
        run: |
          FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git tag v${{ steps.version.outputs.new }}
          git push origin v${{ steps.version.outputs.new }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: TraceBTE v${{ steps.version.outputs.new }}
          files: |
            ${{ steps.jar.outputs.file }}

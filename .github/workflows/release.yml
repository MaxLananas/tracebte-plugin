name: TraceBTE Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read and bump version
        id: version
        run: |
          CURRENT=$(grep '^version =' build.gradle.kts | cut -d '"' -f2 | tr -d '\r\n')

          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "New version: $NEW_VERSION"

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update build.gradle.kts
        run: |
          sed -i "s/version = \"${{ steps.version.outputs.current }}\"/version = \"${{ steps.version.outputs.new }}\"/" build.gradle.kts

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.gradle.kts
          git commit -m "Release v${{ steps.version.outputs.new }}"
          git push

      - name: Build plugin
        run: ./gradlew build --no-daemon

      - name: Locate jar
        id: jar
        run: |
          FILE=$(find build/libs -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          echo "Found jar: $FILE"

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag v${{ steps.version.outputs.new }}
          git push origin v${{ steps.version.outputs.new }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: TraceBTE v${{ steps.version.outputs.new }}
          generate_release_notes: true
          files: |
            ${{ steps.jar.outputs.file }}
